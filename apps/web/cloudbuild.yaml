steps:
  # Build the Docker image from the monorepo root context
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACTS_REPO}/web:${_TAG}
      - -f
      - apps/web/Dockerfile
      - .

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACTS_REPO}/web:${_TAG}

  # Roll out the new image. Everything else about the service (CPU, memory,
  # port, env vars, secrets, public access) is managed by infra/terraform, and
  # `gcloud run deploy` keeps it as is when only the image changes.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - web-${_ENVIRONMENT}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACTS_REPO}/web:${_TAG}
      - --region=${_REGION}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACTS_REPO}/web:${_TAG}

substitutions:
  _REGION: europe-west1
  _ARTIFACTS_REPO: app-boilerplate-docker
  _ENVIRONMENT: staging
  _TAG: latest

options:
  logging: CLOUD_LOGGING_ONLY
